# Copiar en /etc/nginx/sites-available/iptvcontrol.com.ar despues de levantar
# Docker. El certificado ya es administrado por Certbot en la VPS.
server {
    server_name iptvcontrol.com.ar www.iptvcontrol.com.ar;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/iptvcontrol.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptvcontrol.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name iptvcontrol.com.ar www.iptvcontrol.com.ar;
    return 301 https://iptvcontrol.com.ar$request_uri;
}
