# =============================================================================
# Nginx del panel de IPTVControl
# =============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión: el bundle baja de ~390 kB a ~110 kB.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas. El backend agrega las suyas con Helmet.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los assets llevan hash en el nombre, así que se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La API la sirve el backend NestJS. Se proxea desde el mismo origen para no
    # depender de CORS ni exponer dos dominios distintos.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las altas hablan con el proveedor: puede tardar.
        proxy_read_timeout 120s;
    }

    # SPA: cualquier ruta desconocida devuelve index.html y el router resuelve.
    # Sin esto, recargar en /customers/123 daría 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
