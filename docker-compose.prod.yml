# IPTVControl - stack de produccion para una unica VPS.
# Uso: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
name: iptvcontrol

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iptvcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-iptvcontrol}
      APP_DB_USER: ${APP_DB_USER:-iptvcontrol_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-iptvcontrol} -d ${POSTGRES_DB:-iptvcontrol}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL es obligatoria}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS es obligatoria}
      DATABASE_URL: postgresql://${APP_DB_USER:-iptvcontrol_app}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-iptvcontrol}?schema=public
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:-iptvcontrol}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iptvcontrol}?schema=public
      APP_DB_USER: ${APP_DB_USER:-iptvcontrol_app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY es obligatoria}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?AUTH0_DOMAIN es obligatoria}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?AUTH0_AUDIENCE es obligatoria}
      AUTH0_ISSUER_URL: ${AUTH0_ISSUER_URL:?AUTH0_ISSUER_URL es obligatoria}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:?AUTH0_MGMT_CLIENT_ID es obligatoria}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:?AUTH0_MGMT_CLIENT_SECRET es obligatoria}
      AUTH0_DB_CONNECTION: ${AUTH0_DB_CONNECTION:-Username-Password-Authentication}
      AUTH0_INVITATION_TTL_SEC: ${AUTH0_INVITATION_TTL_SEC:-259200}
      SWAGGER_USER: ${SWAGGER_USER:-}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      SENSA_RATE_LIMIT_PER_MINUTE: ${SENSA_RATE_LIMIT_PER_MINUTE:-60}
      SENSA_REQUEST_TIMEOUT_MS: ${SENSA_REQUEST_TIMEOUT_MS:-15000}
      SENSA_DNI_MAX_RETRIES: ${SENSA_DNI_MAX_RETRIES:-25}
      SEED_OPERADOR_NOMBRE: ${SEED_OPERADOR_NOMBRE:-TECNOLOGIA ACTIVA S.A.S.}
      SEED_ROOT_EMAIL: ${SEED_ROOT_EMAIL:?SEED_ROOT_EMAIL es obligatoria}
      SEED_ROOT_AUTH0_USER_ID: ${SEED_ROOT_AUTH0_USER_ID:-}
      SEED_DNI_INICIAL_SENSA: ${SEED_DNI_INICIAL_SENSA:-30000000}
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:?VITE_AUTH0_DOMAIN es obligatoria}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:?VITE_AUTH0_CLIENT_ID es obligatoria}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:?VITE_AUTH0_AUDIENCE es obligatoria}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN es obligatoria}
      TLS_EMAIL: ${TLS_EMAIL:?TLS_EMAIL es obligatoria}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
